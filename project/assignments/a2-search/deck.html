<style>
/* the 1920x1080 stage scales to the window. Same visual language as Assignment 1: the summary page grows with every assignment. */
:root {
  --bg: #0E1216; --ink: #EDE8DE; --muted: #98A1A7; --faint: #5D6870;
  --line: rgba(255, 255, 255, .12); --panel: rgba(255, 255, 255, .04);
  --amber: #EAB24F; --amber-soft: rgba(234, 178, 79, .13);
  --coral: #E27A5C; --coral-soft: rgba(226, 122, 92, .13);
  --mint: #74C8B4; --mint-soft: rgba(116, 200, 180, .13);
  --font: "Space Grotesk", "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
  --ease: cubic-bezier(.2, .75, .2, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: #07090B; color: var(--ink); font-family: var(--font); overflow: hidden;
       -webkit-font-smoothing: antialiased; }
#deck { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
         transform: translate(-50%, -50%) scale(var(--s, .5)); background: var(--bg); }
.bgfx { position: absolute; inset: 0; width: 100%; height: 100%; }

/* the outgoing slide fades fast, the incoming one enters slightly later: two full slides never overlap */
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transform: translateY(18px);
         transition: opacity .32s cubic-bezier(.4, 0, 1, 1), transform .32s cubic-bezier(.4, 0, 1, 1), visibility 0s linear .32s; }
.slide.past { transform: translateY(-18px); }
.slide:not(.active) { pointer-events: none; }        /* a fading slide must not catch clicks */
.slide.active { opacity: 1; visibility: visible; transform: none;
                transition: opacity .55s var(--ease) .14s, transform .8s var(--ease) .14s, visibility 0s; }
.art { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; font-family: var(--font); fill: var(--ink); }
.num { font-variant-numeric: tabular-nums; }       /* counters: fixed-width digits so they don't shift while counting */

/* metin */
.kick { font-size: 17px; font-weight: 600; letter-spacing: .22em; fill: var(--amber); }
.ttl { font-size: 58px; font-weight: 700; letter-spacing: -.02em; }
.cov { font-size: 150px; font-weight: 700; letter-spacing: -.045em; }
.cov-s { font-size: 40px; font-weight: 400; fill: #C9C3B8; }
.h1 { font-size: 46px; font-weight: 700; letter-spacing: -.015em; }
.h2 { font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
.h3 { font-size: 25px; font-weight: 600; }
.b { font-size: 24px; }
.m { font-size: 21px; fill: var(--muted); }
.s { font-size: 18px; fill: var(--muted); }
.xs { font-size: 15px; fill: var(--muted); }
.foot { font-size: 15px; fill: var(--faint); }
.mono { font-family: var(--mono); font-weight: 600; }
.mid { text-anchor: middle; } .end { text-anchor: end; }
.amber { fill: var(--amber); } .coral { fill: var(--coral); } .mint { fill: var(--mint); }
.ink { fill: var(--ink); } .muted { fill: var(--muted); } .dark { fill: #0E1216; } .soft { fill: #C9C3B8; }

/* surfaces */
.panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.panel-a { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 2; }
.panel-m { fill: var(--mint-soft); stroke: var(--mint); stroke-width: 1.5; }
.panel-c { fill: var(--coral-soft); stroke: var(--coral); stroke-width: 1.5; }
.ico { color: var(--amber); }
.dash { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 6; fill: none; }

/* tahta */
.bd-rim { fill: #465966; stroke: #465966; stroke-linejoin: round; }
.bd-face { fill: url(#gBoard); }
.bd-in { fill: none; stroke: rgba(255, 255, 255, .06); stroke-width: 2; }
.hole { fill: url(#gHole); stroke: rgba(255, 255, 255, .05); stroke-width: 1.5; }
.msh { fill: rgba(0, 0, 0, .45); }
.mB { stroke: rgba(255, 255, 255, .3); stroke-width: 1.2; }
.mW { stroke: rgba(0, 0, 0, .25); stroke-width: 1; }
.mb .mi { transform-box: fill-box; transform-origin: center; transition: opacity .5s var(--ease), transform .55s cubic-bezier(.5, 0, .75, .4); }
.mb.out .mi { opacity: 0; transform: translateY(6px) scale(.3); }
.drop .mb .mi { animation: drop .6s var(--ease) var(--dl, 0ms) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-30px); } }
/* move marker: which marbles, which direction; fades when the move starts */
.cue { transition: opacity .3s var(--ease); }
.cue.gone { opacity: 0; }
.cue circle { animation: fade-in .3s var(--ease) both; }
.cue line { transform-box: view-box; animation: grow .45s var(--ease) .12s both; }
.ring-w { fill: none; stroke: #EDE8DE; stroke-width: 2.5; stroke-dasharray: 5 5; opacity: .55; }
.spot { fill: rgba(234, 178, 79, .12); stroke: var(--amber); stroke-width: 3; stroke-dasharray: 6 5; }

/* step-by-step reveal */
.art > .rise { animation: fade-in .7s var(--ease) var(--r, 0ms) both; }
.art > text.rise { animation-name: rise-up; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes rise-up { from { opacity: 0; transform: translateY(16px); } }
.art [data-in] { transition: opacity .55s var(--ease) var(--d, 0ms), transform .7s var(--ease) var(--d, 0ms); }
.art [data-in]:not(.on) { opacity: 0; pointer-events: none; }
.art text[data-in]:not(.on) { transform: translateY(14px); }
.trail > * { animation: fade-in .45s var(--ease) both; }
.fadeable { transition: opacity .45s var(--ease); }
.dim { opacity: .18 !important; transition: opacity .4s var(--ease); }
.hit { cursor: pointer; }
.hit:hover .bd-rim { stroke: #5C7383; fill: #5C7383; }
.slot { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 5; }
.trow rect.bg { fill: var(--panel); stroke: var(--line); stroke-width: 1; }

/* animasyonlar */
.cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop-in .45s var(--ease) var(--pd, 0ms) both; }
@keyframes pop-in { from { opacity: 0; transform: scale(.3); } }
.wave { animation: wave 1.1s ease-out var(--wd, 0ms) both; }
@keyframes wave { 0% { opacity: 0; } 35% { opacity: .8; } 100% { opacity: .22; } }
.late { animation: fade-in .6s var(--ease) var(--ld, 0ms) both; }
.mv { transform-box: fill-box; animation: mv .9s var(--ease) .45s both; }
@keyframes mv { to { transform: translate(var(--tx, 0), var(--ty, 0)); } }
.fall { transform-box: fill-box; transform-origin: center; animation: fall .9s var(--ease) .45s both; }
@keyframes fall { to { transform: translate(34px, 0) scale(.3); opacity: 0; } }
/* arrows and lines grow from their tail (JS sets transform-origin to the tail) */
.grow { transform-box: view-box; animation: grow .5s var(--ease) var(--pd, 0ms) both; }
@keyframes grow { 0% { opacity: 0; transform: scale(.04); } 30% { opacity: 1; } 100% { transform: none; } }
.fadein { animation: fade-in .5s var(--ease) var(--pd, 0ms) both; }
.pop-t { animation: fade-in .4s var(--ease) var(--pd, 0ms) both; }
.bar-x { transform-box: fill-box; transform-origin: 0 50%; animation: bar-x .9s var(--ease) var(--pd, 0ms) both; }
@keyframes bar-x { from { transform: scaleX(0); } }
.strike { stroke-dasharray: var(--len) var(--len); animation: strike .45s var(--ease) var(--pd, 0ms) both; }
@keyframes strike { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
.gone-soft { transition: opacity .6s var(--ease); opacity: .32; }
.tr { transition: transform .8s var(--ease), fill .4s, opacity .4s; }
.brand { opacity: .9; }
.hl-t { transition: fill .35s var(--ease), opacity .35s var(--ease); }
.oldp { transition: fill .5s var(--ease); }
.oldp.struck { fill: var(--faint); text-decoration: line-through; }

/* navigation: hexagon dots */
#nav { position: absolute; right: 40px; bottom: 22px; display: flex; align-items: center;
       gap: 6px; z-index: 3; opacity: .75; transition: opacity .3s; }
#nav:hover, body.ui #nav { opacity: 1; }
#dots { display: flex; gap: 4px; }
#nav button { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; }
#nav svg { width: 18px; height: 18px; }
#nav polygon { fill: none; stroke: #7B868E; stroke-width: 2; transition: fill .3s, stroke .3s; }
#nav button.cur polygon { fill: var(--amber); stroke: var(--amber); }
#nav button.done polygon { stroke: var(--amber); }
#nav button:focus-visible { outline: 2px solid var(--amber); border-radius: 6px; }
#count { margin-left: 10px; font: 600 15px/1 var(--font); color: var(--faint); letter-spacing: .08em; font-variant-numeric: tabular-nums; }

/* speaker notes: N */
#notes { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: none; padding: 18px 120px 24px 40px;
         background: rgba(7, 9, 11, .94); border-top: 2px solid var(--amber); font: 400 24px/1.4 var(--font); color: var(--ink); }
body.notes #notes { display: block; }
#notes .meta { font: 600 16px/1 var(--font); letter-spacing: .1em; color: var(--amber); margin-bottom: 10px; }
#notes .meta span { color: var(--muted); font-weight: 500; letter-spacing: .04em; }
#notes .next { color: var(--muted); font-size: 18px; margin-top: 8px; }
body.export *, body.export *::before, body.export *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important;
                           transition-duration: .01ms !important; transition-delay: 0ms !important; }
}
</style>
</head>

          this.a2.style.fill = C.bg; this.a2l.style.fill = C.ink;
          anim(this.prog, "bar-x", 1100);
          setTimeout(() => { if (alive(r)) { this.a2.style.fill = C.amber; this.a2l.style.fill = C.amber; } }, RM.matches ? 0 : 1950);
        }
      },
    },

    9: {
      init() {
        head("s9-head", null, "BACKUP · NUMBERS");
        const tr = D.tree, v = D.verify, bn = D.bench, d3 = bn.table.find(r => r.d === 3);
        const rows = [
          ["123 bits", "61 cells × 2 bits (empty, black, white) + 1 bit for whose turn"],
          [`${D.count.start.total} / ${D.count.midB.total} moves`, "our generator: the standard start / our Assignment 1 mid-game, Black to move"],
          ["≈ 60 moves, 87 plies", "Lemmens [3]: average branching factor and game length (PBEM archive)"],
          [`${fmt(v.positions)} positions`, `both generators, seed ${v.seed}: ${fmt(v.moves)} moves, ${fmt(v.pushes)} pushes, identical boards`],
          [`${tr.perft.map(fmt).join(" / ")}`, "perft(1–4): all move sequences from the start; distinct boards by de-duplicating"],
          [`${fmt(tr.backToStart)} paths`, "four-ply paths from the start that end on the start (44 × 44: every move can be undone)"],
          [`${fmt(tr.rate)} nodes/s`, "successor generation timed on 20,000 boards at ply 4, Python 3.14, one core"],
          ["≈ 23 MB → ≈ 7.6 PB", `BFS keeps every reached board: ${fmt(tr.reached[3])} × 16 B at ply 4; × ${(tr.reached[3] / tr.reached[2]).toFixed(1)} per ply (measured, ply 3 → 4) to ply 10`],
          ["16 GB full after ply 6", "ply 5: 0.6 GB, ply 6: 15.7 GB, ply 7: 415 GB · DFS stack at ply 10: (44 + 60 × 9) boards × 16 B ≈ 9.3 KB"],
          [`${tr.secs[3]} s → ≈ 9 h`, `time to ply 4 in our engine; × ${Math.round(tr.perft[3] / tr.perft[2])} per ply, as the paths grow (perft(4) / perft(3)): ply 5 ≈ 10 min, ply 6 ≈ 9 h`],
          ["47× (UCS / BFS)", "mean nodes at d = 2: UCS tests the goal when it expands a node, BFS when it generates one"],
          [`+${tr.idsOverPct.toFixed(1)} %`, "IDS = Σ over limits 1–4 of Σ perft(1..limit), against BFS = Σ perft(1..4)"],
          [`${bn.n} puzzles`, `random 12–28 plies from the start, no marble off, Black to move, seed ${bn.seed}; d = optimal length`],
          [`${Math.round(d3.BFS.gen / d3["A* hF"].gen)}×, b* ${d3.BFS.bstar.toFixed(1)} → ${d3["A* hF"].bstar.toFixed(1)}`, "mean nodes at d = 3 (37 puzzles); b* solved from N + 1 = 1 + b* + … + (b*)^d"],
          [`${bn.bad} of ${fmt(bn.edges)}`, "edges where hF(n) > 1 + hF(n′), over every edge A* evaluated in all puzzles"],
          [`${D.demo.plan.breaks} of ${D.demo.plan.replies}`, "White replies after our first push after which the second push no longer works"],
        ];
        const g = $("s9-rows");
        const gap = Math.min(54, 776 / rows.length);      // rows fit between 244 … 1020
        rows.forEach(([a, b], i) => {
          const y = 244 + i * gap, rg = E("g", { class: "stg" }, g);
          if (i % 2 === 0) E("rect", { x: 120, y, width: 1680, height: gap - 4, rx: 10, fill: "rgba(255,255,255,.03)" }, rg);
          T(rg, 150, y + gap / 2 + 4, a, "s", { style: `fill:${C.amber};font-weight:600;font-size:18px` });
          T(rg, 600, y + gap / 2 + 4, b, "s", { style: `fill:${C.ink};font-size:17px` });
        });
      },
    },

    10: {
      init() {
        head("s10-head", null, "BACKUP · STATE SPACE");
        const st = D.states, g = $("s10-rows");
        const e = v => { const p = Math.floor(Math.log10(v)); return [(v / 10 ** p).toFixed(2) + " × 10", [String(p)]]; };
        const rows = [
          ["every cell empty, black or white", "3^61", e(st.naive), "upper bound, ignores marble counts", C.muted],
          ["8–14 marbles per side (not both 8)", "Σ C(61, b) · C(61 − b, w)", e(st.ours), "our count; × 2 for whose turn", C.amber],
          ["Lemmens' formula [3], evaluated by us", "same sum, / 12 for symmetry", e(st.lemmensFormula12), "the paper prints 6.5 × 10^23: we could not reproduce it", C.coral],
          ["Aichholzer, as quoted by Chorus [4]", "", ["≈ 1 × 10", ["25"]], "agrees with our count", C.muted],
          ["game tree, Lemmens [3]", "60^87", e(st.gameTree), "b ≈ 60, 87 plies", C.muted],
        ];
        rows.forEach(([a, f, v, n, col], i) => {
          const y = 290 + i * 128, rg = E("g", { class: "stg" }, g);
          card(rg, 120, y, 1680, 108, "panel", 18);
          T(rg, 150, y + 46, a, "h3", { style: "font-size:22px" });
          T(rg, 150, y + 80, f, "mono", { style: `font-size:17px;fill:${C.muted}` });
          TS(rg, 1180, y + 64, v, "h2 end", { style: `fill:${col}` });
          T(rg, 1220, y + 62, n, "s", { style: col === C.coral ? `fill:${C.coral}` : null });
        });
      },
    },

    11: {
      init() {
        head("s11-head", null, "BACKUP · SOURCES");
        const refs = [
          ["S. Russell, P. Norvig. Artificial Intelligence: A Modern Approach, 4th ed., Ch. 3. Pearson, 2020;", "S. Okyay, week 01 (syllabus) and week 04–05 slides.",
           "formulation, abstraction, the six uninformed searches, A*, admissible and consistent heuristics, relaxed problems, b*, the chapter order"],
          ["M. Lalet, L. Lévi. Abalone Classic: Rules. Asmodee.", "", "the rules our generators follow: in-line, side-step, sumito, pushing off, winning"],
          ["N. Lemmens. Constructing an Abalone game-playing agent.", "BSc thesis, Maastricht University, 2005.", "average branching factor ≈ 60, average game 87 plies, the state-space formula"],
          ["P. Chorus. Implementing a computer player for Abalone using alpha-beta and", "Monte-Carlo search. MSc thesis, Maastricht University, 2009.", "Aichholzer's state-space estimate ≈ 10^25"],
          ["Our code: abalone_search.py (Python, standard library).", "", "every count, timing and experiment on slides 2–10; the slides read its output files"],
        ];
        const g = $("s11-refs");
        refs.forEach(([a, b, use], i) => {
          const y = 290 + i * 138, rg = E("g", { class: "stg" }, g);
          T(rg, 120, y, `[${i + 1}]`, "h3 amber");
          T(rg, 180, y, a, "s", { style: `fill:${C.ink};font-size:20px` });
          if (b) T(rg, 180, y + 30, b, "s", { style: `fill:${C.ink};font-size:20px` });
          T(rg, 180, y + (b ? 64 : 34), "Used for: " + use, "s", { style: `fill:${C.mint}` });
        });
      },
    },
  };

  /* ------------------------------------------------------------ speaker notes */
  // each slide: [speaker, [per step [seconds, text]]] · seconds ≈ words / 2.7 (≈ 160 words/min), never shorter than the step's animation
  const NOTES = {
    1: ["Salih", [[13, "Hi, we're team Eight Bits: I'm Salih, this is Eren. Four questions today: how search sees Abalone, what we kept, what searches cost, and whether an estimate helps."]]],
    2: ["Salih", [[11, "One atomic state: sixty-one cells, empty, black or white, plus whose turn: a hundred twenty-three bits. Marbles off aren't stored, because the board shows them."],
                 [11, "ACTIONS: one to three marbles in a line plus a direction, because that's how the rules define a move. From the start: fourteen single steps,"],
                 [2, "twenty in-line group moves,"],
                 [2, "and ten side-steps."],
                 [7, "Forty-four from our generator, sixty on average: each ply multiplies the work about fifty times."]]],
    3: ["Salih", [[3, "RESULT gives the next board."],
                 [11, "This push moves three of ours and two of theirs; one falls off. Deterministic, so unlike a dice game we can plan ahead exactly."],
                 [11, "ACTION-COST is one per move, not per marble, because the rules count turns; counting marbles would reward tiny steps. So optimal means fastest win."],
                 [10, "Goal: six marbles off. Since all costs are equal, breadth-first and iterative deepening already find the fewest moves; uniform-cost adds nothing."]]],
    4: ["Salih", [[4, "How much of the real game did we keep?"],
                 [10, "Every rule. We found no published move counts for Abalone, so we wrote two independent generators; on two thousand positions they agree."],
                 [10, "We dropped physics, the clock and the history: they don't change the outcome. The price: boards repeat, so search must remember them."],
                 [14, "What we broke is the rival. Our plan, push then push, is fixed, but White replies in between: six of seventy-five replies break it. So we search with White frozen. Eren?"]]],
    5: ["Eren", [[8, "Thanks. Our real game tree, both sides moving: forty-four boards, then two thousand, a hundred thousand, five million."],
                 [10, "Breadth-first finds the fewest moves, but it keeps every board, so sixteen gigabytes are full after ply six, which takes nine hours."],
                 [9, "Depth-first is the opposite: one path, under ten kilobytes, but since moves can be undone, it can loop forever."],
                 [10, "So we choose iterative deepening: depth-first memory with breadth-first's answer, for only two percent more nodes, and it can stop any time."],
                 [9, "We skip uniform-cost: same answer, forty-seven times the nodes. And all of them fall short: four plies of eighty-seven."]]],
    6: ["Eren", [[3, "So we add an estimate."],
                 [12, "hR looks only at the rival: steps to the edge. It never overestimates, since a move pushes two marbles at most; but here it says one: blind."],
                 [11, "hF also counts our side: two steps to the push spot, plus the push: three, exactly the true cost. That's why we use hF."],
                 [12, "We trust it because one move shifts each marble one cell at most, so hF never drops faster than the cost: consistent, so A* stays optimal."]]],
    7: ["Eren", [[3, "Same puzzle, four searches, same speed."],
                 [12, "Shading shows where each looked. A* with hF goes straight to the push: 439 nodes. Greedy is cheap, but plans 320 moves, so we reject it."],
                 [3, "Over sixty puzzles, the same picture."],
                 [8, "Thirty-one times fewer nodes than breadth-first, and always the fewest moves. The trade-off: A* still keeps every node."]]],
    8: ["Eren", [[4, "Our agent page from Assignment 1, updated in amber,"],
                 [12, "plus our plan: iterative deepening for low memory, A* with hF while White is frozen. Next, Chapter 4 and Chapter 6 bring the rival back. Thank you!"]]],
  };
  const notesEl = $("notes");
  let clock0 = null;
  function showNotes() {
    const nt = NOTES[cur];
    if (!nt) { $("nMeta").textContent = `Slide ${cur} · backup`; $("nSay").textContent = "Backup slide for questions."; $("nNext").textContent = ""; return; }
    const [who, steps] = nt, sIdx = Math.min(step, steps.length - 1);
    let until = 0;
    for (let s = 1; s <= cur; s++) if (NOTES[s]) NOTES[s][1].forEach(([t], j) => { if (s < cur || j <= sIdx) until += t; });
    const mmss = x => Math.floor(x / 60) + ":" + String(Math.round(x % 60)).padStart(2, "0");
    const el = clock0 === null ? 0 : (performance.now() - clock0) / 1000;
    $("nMeta").innerHTML = `SLIDE ${cur} · STEP ${step + 1}/${MAX[cur] + 1} · ${who.toUpperCase()} <span>· finish this step by ${mmss(until)} · now ${mmss(el)}</span>`;
    $("nSay").textContent = steps[sIdx] ? steps[sIdx][1] : "";
    const nx = step + 1 <= MAX[cur] ? (steps[step + 1] || [0, ""])[1] : (NOTES[cur + 1] ? "Next slide: " + NOTES[cur + 1][1][0][1] : "");
    $("nNext").textContent = nx ? "→ " + nx : "";
  }
  setInterval(() => { if (document.body.classList.contains("notes")) showNotes(); }, 1000);

  /* ------------------------------------------------------------ steps and navigation */
  function reveal(n, k, animate) {
    const fresh = [];
    SL[n - 1].querySelectorAll("[data-in]").forEach(e => {
      const on = k >= +e.dataset.in;
      if (on && !e.classList.contains("on")) fresh.push(e);
      else if (!on && e.classList.contains("on")) { e.style.setProperty("--d", "0ms"); e.classList.remove("on"); }
    });
    let t = 0;
    fresh.forEach(e => {
      e.style.setProperty("--d", animate ? Math.round(t) + "ms" : "0ms");
      e.classList.add("on");
      t = Math.min(t + 120, 900);
    });
  }
  // incoming slide: top-level elements rise 45 ms apart, .stg rows 40 ms apart among themselves
  function enterFx(n) {
    if (RM.matches) return;
    const kids = [...SL[n - 1].querySelector(".art").children].filter(e => !e.hasAttribute("data-in") && e.tagName !== "defs");
    const rows = [...SL[n - 1].querySelectorAll(".stg")];
    kids.concat(rows).forEach(e => e.classList.remove("rise"));
    kids.forEach((e, i) => e.style.setProperty("--r", 140 + Math.min(i * 45, 600) + "ms"));
    rows.forEach((e, i) => e.style.setProperty("--r", 260 + Math.min(i * 40, 700) + "ms"));
    flush(stage);
    kids.concat(rows).forEach(e => e.classList.add("rise"));
  }
  stage.addEventListener("animationend", e => e.target.classList.remove("rise"));
  const dotsEl = $("dots"), countEl = $("count");
  const dots = SL.map((_, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-label", "Slide " + (i + 1));
    b.innerHTML = `<svg viewBox="0 0 20 20"><polygon points="${pts(hexPts(10, 10, 8, true))}"/></svg>`;
    b.addEventListener("click", e => { e.stopPropagation(); go(i + 1, 0); });
    dotsEl.appendChild(b);
    return b;
  });
  function updateNav() {
    dots.forEach((b, i) => { b.classList.toggle("cur", i + 1 === cur); b.classList.toggle("done", i + 1 < cur); });
    countEl.textContent = `${cur} / ${N}`;
  }
  function go(n, k = 0) {
    n = Math.max(1, Math.min(N, n));
    k = Math.max(0, Math.min(MAX[n], k));
    const prevN = cur, prevK = step, changed = n !== prevN;
    if (clock0 === null && prevN === 1 && (n > 1 || k > 0)) clock0 = performance.now();
    run++;
    const r = run;
    if (changed) {
      SL.forEach((s, i) => {
        const m = i + 1;
        s.classList.toggle("active", m === n);
        s.classList.toggle("past", m < n);
        s.setAttribute("aria-hidden", m === n ? "false" : "true");
      });
    }
    // no animation on export: each step is drawn directly in its final state
    const from = EXPORT ? Infinity : changed ? (n > prevN ? -1 : Infinity) : prevK;
    cur = n; step = k;
    if (H[n] && H[n].step) H[n].step(k, from, r);
    stepT0 = performance.now();
    if (H[n] && H[n].frame) { if (EXPORT || RM.matches) H[n].frame(1e3, k); else if (!raf) raf = requestAnimationFrame(loop); }
    reveal(n, k, !changed || n > prevN);
    if (changed && H[n] && H[n].enter) H[n].enter();
    updateNav();
    if (document.body.classList.contains("notes")) showNotes();
    try { history.replaceState(null, "", "#slide-" + n); } catch (e) { /* ignored under file:// */ }
  }
  // frame loop for the canvas and live-search slides; stops by itself on another slide
  let raf = 0, stepT0 = 0;
  function loop(now) {
    const h = H[cur];
    if (h && h.frame && h.frame((now - stepT0) / 1000, step) !== false) raf = requestAnimationFrame(loop); else raf = 0;
  }
  const next = () => (step < MAX[cur] ? go(cur, step + 1) : cur < N && go(cur + 1, 0));
  const prev = () => (step > 0 ? go(cur, step - 1) : cur > 1 && go(cur - 1, MAX[cur - 1]));

  /* ------------------------------------------------------------ girdi */
  window.addEventListener("keydown", e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (e.target.closest && e.target.closest("button") && (k === " " || k === "Enter")) return;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "Home") { e.preventDefault(); go(1, 0); }
    else if (k === "End") { e.preventDefault(); go(N, MAX[N]); }
    else if (k === "f" || k === "F") toggleFs();
    else if (k === "n" || k === "N") { document.body.classList.toggle("notes"); showNotes(); }
    else if (k === "r" || k === "R") go(cur, step);           // replay the step
  });
  let swiped = false, tx = null, ty = null;
  stage.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    tx = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) { swiped = true; dx < 0 ? next() : prev(); }
  }, { passive: true });
  let hadFocus = true;                       // in an embedded frame the first click only gives focus
  window.addEventListener("pointerdown", () => { hadFocus = document.hasFocus(); }, true);
  stage.addEventListener("click", e => {
    if (swiped) { swiped = false; return; }
    if (!hadFocus) { hadFocus = true; return; }
    if (e.target.closest(".hit, #nav, #notes")) return;
    next();
  });
  // #slide-3 opens the slide; #slide-3.end or #slide-3.2 jumps straight to that step (for PPTX export)
  function fromHash() {
    const h = /slide-(\d+)(?:\.(\d+|end))?/.exec(location.hash || "");
    const n = h ? Math.max(1, Math.min(N, +h[1])) : 1;
    return [n, h && h[2] ? (h[2] === "end" ? MAX[n] : +h[2]) : 0];
  }
  window.addEventListener("hashchange", () => {
    const [n, k] = fromHash();
    if (n !== cur || k !== step) go(n, k);
  });
  function toggleFs() {
    const d = document;
    try {
      if (!d.fullscreenElement) { const p = d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
      else if (d.exitFullscreen) d.exitFullscreen();
    } catch (err) { /* skip silently if fullscreen is unavailable */ }
  }
  let uiTimer = 0;
  window.addEventListener("mousemove", () => {
    document.body.classList.add("ui"); clearTimeout(uiTimer);
    uiTimer = setTimeout(() => document.body.classList.remove("ui"), 2200);
  }, { passive: true });

  /* ------------------------------------------------------------ scale and start-up */
  // ?export: fixed scale for 1920x1080 screenshots, navigation hidden
  const EXPORT = /export/.test(location.search);
  if (EXPORT) { $("nav").style.display = "none"; document.body.classList.add("export"); }
  function fit() { stage.style.setProperty("--s", EXPORT ? 1 : Math.min(window.innerWidth / 1920, window.innerHeight / 1080)); }
  window.addEventListener("resize", fit);
  fit();
  [stage, $("deck")].forEach(el => el.addEventListener("scroll", () => { el.scrollLeft = 0; el.scrollTop = 0; }));

  Object.values(H).forEach(h => h.init && h.init());
  setTimeout(preBg, 2500);                           // starts after the cover animation ends
  SL.forEach((s, i) => {
    let m = (H[i + 1] && H[i + 1].extra) || 0;
    s.querySelectorAll("[data-in]").forEach(e => { m = Math.max(m, +e.dataset.in); });
    MAX[i + 1] = m;
  });
  go(...fromHash());
})();
</script>
</body>
